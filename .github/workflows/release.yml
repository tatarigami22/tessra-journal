name: Build and release

# Push a tag like v1.0.1 to build the Mac and Windows installers and publish a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          body: |
            ## Download
            - **Mac (Apple Silicon, M1 and newer):** the file ending in `mac-arm64.dmg`
            - **Mac (Intel):** the file ending in `mac-x64.dmg`
            - **Windows:** `Tessra-Setup-....exe`

            First launch on Mac: right click Tessra in Applications and choose Open (or System Settings > Privacy & Security > Open Anyway).
            First launch on Windows: if SmartScreen appears, click More info > Run anyway.
