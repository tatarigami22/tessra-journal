name: Build and release

# Bump "version" in package.json and push to main: this builds the Mac and Windows
# installers and publishes release v<version>. Pushes that don't change the version are skipped.
on:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "release=false" >> "$GITHUB_OUTPUT"; echo "v$V already released, skipping"; else echo "release=true" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: version
    if: needs.version.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Build installers
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -o pipefail
          npm run ${{ matrix.script }} 2>&1 | tee build.log || { tail -25 build.log | sed 's/^/::error::/'; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Tessra ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: out/*
          generate_release_notes: true
          body: |
            ## Download
            - **Mac (Apple Silicon, M1 and newer):** the file ending in `mac-arm64.dmg`
            - **Mac (Intel):** the file ending in `mac-x64.dmg`
            - **Windows:** `Tessra-Setup-....exe`

            First launch on Mac: right click Tessra in Applications and choose Open (or System Settings > Privacy & Security > Open Anyway).
            First launch on Windows: if SmartScreen appears, click More info > Run anyway.

            The .zip files are used by Tessra's built-in updater, you don't need to download them.
